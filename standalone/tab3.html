<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>해파 탐구실 — 풍랑·너울·연안 쇄파</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 해파 탐구실 '풍랑·너울·연안 쇄파' 탭을 단독으로 쓰기 위해 css/style.css 에서 이 탭이 쓰는 규칙만 모음.
   원본 사이트(index.html)의 탭3 와 같은 모습·동작이며, 이 파일 하나만 있으면 file:// 로 열어도 동작함 */
:root{
  --ink:#24303A; --ink-2:#4A5763; --ink-3:#7B8792; --line:#C3CDD5;
  --paper:#FFFDF8; --ground:#E6EEF3;
  --sea:#2E7DB0; --sea-deep:#1E5A85; --sky:#BFE3F5;
  --sand:#E6C377; --sand-2:#D9AD5C; --clay:#B9744A; --rock:#8A8276;
  --accent:#E8553E; --accent-2:#C7432E; --ok:#3FA36B; --warn:#F2B233; --bad:#D9483B;
  --tab1:#5B9BD5; --tab2:#E0A93B; --tab3:#8C7BB5; --tab4:#E8553E; --tab5:#6AAE78;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --bw:2px;          /* 카드·버튼·탭 테두리 */
  /* 그림(16:9) 폭은 화면 높이에 맞춰 정함: 머리말·버튼 줄·해설 카드·바닥글에 필요한 세로 공간(--reserve)을 뺀 높이 기준.
     전체 폭(--maxw)은 그림 + 오른쪽 조작 카드(--side) + 여백으로, 화면이 넓어도 패널 안에 빈 공간이 생기지 않게 함 */
  --reserve:300px; --side:300px;
  --simw:clamp(560px,calc((100vh - var(--reserve)) * 16 / 9),1140px);
  --maxw:calc(var(--simw) + var(--side) + 72px);
}
@supports (height:100dvh){:root{--simw:clamp(560px,calc((100dvh - var(--reserve)) * 16 / 9),1140px)}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);cursor:pointer;border:none}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
/* ---------- 상단 ---------- */
.top{max-width:var(--maxw);margin:0 auto;padding:8px 16px 0;width:100%;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.6vw,28px);line-height:1.2;margin:0;letter-spacing:-.5px;flex:none}
.brand .sub{font-size:clamp(12px,1.5vw,15px);color:var(--ink-2);border-left:2px solid rgba(36,48,58,.25);padding-left:10px;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* ---------- 본문 ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 4px;width:100%}
/* 탭마다 색(--tc)·옅은 색(--tc-soft) */
.panel{display:none;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:0 14px 14px 14px;padding:12px;box-shadow:0 4px 0 rgba(36,48,58,.08)}
.panel.active{display:block}
#panel3{--tc:var(--tab3);--tc-soft:#EEEAF6}
/* ---------- 실험실 레이아웃: 왼쪽 그림 + 오른쪽 조작 카드 (좁은 화면에서는 그림 아래) ---------- */
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.lab-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.sim{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%;max-width:var(--simw);margin:0 auto}
@media(min-width:900px){
  .lab-grid{grid-template-columns:minmax(0,1fr) minmax(250px,var(--side));align-items:start}
  .sim{max-width:none}
}
.stage-wrap{position:relative;width:100%;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sky)}
.stage-wrap svg,.stage-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-family:var(--display);font-size:clamp(14px,1.6vw,19px);padding:4px 13px;border-radius:999px;pointer-events:none}
/* ---------- 버튼 ---------- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .spacer{flex:1}
.btn{font-size:16px;line-height:1.25;padding:6px 14px;border-radius:10px;background:#fff;color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:0 2px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;user-select:none;-webkit-user-select:none;white-space:nowrap}
.btn:hover{background:#F4F7FA}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 2px 0 var(--ink)}
.btn:disabled:hover{background:#fff}
/* ---------- 해설 카드 (그림 아래) ---------- */
.explain{background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:9px 12px;font-size:16px;line-height:1.6}
.ex-row{display:flex;align-items:flex-start;gap:10px}
.ex-title{flex:none;font-family:var(--display);font-size:16px;line-height:1.3;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;margin-top:2px;white-space:nowrap}
.ex-main{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.explain b{font-weight:700;color:var(--ink);background:linear-gradient(transparent 60%,rgba(255,214,102,.65) 60%)}
.ex-btn{flex:none;margin-top:2px;font-family:var(--body);font-size:14px;line-height:1.3;color:var(--ink-2);background:#F4F7FA;border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
.ex-btn:hover{border-color:var(--ink-3);color:var(--ink)}
.ex-more{margin-top:8px;padding-top:8px;border-top:1.5px dashed var(--line);font-size:15px;color:var(--ink-2);word-break:keep-all;overflow-wrap:anywhere}
/* ---------- 카드 ---------- */
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:9px 12px 10px}
.card h3{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.3;margin:0 0 4px;display:flex;align-items:center;gap:8px;white-space:nowrap}
/* ---------- 탭3: 관찰 순서 ---------- */
.stepper{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.stepper>li{border:var(--bw) solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.stepper>li.on{border-color:var(--ink);background:var(--tc-soft)}
.st-btn{width:100%;display:flex;align-items:center;gap:9px;padding:7px 10px;background:none;text-align:left;color:var(--ink)}
.st-btn:hover{background:rgba(36,48,58,.04)}
.st-num{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:var(--bw) solid var(--ink);background:#fff;font-size:14px}
.stepper>li.on .st-num{background:var(--tc);color:#fff}
.stepper>li.done .st-num{background:var(--ink);color:#fff}
.st-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.st-txt b{font-weight:400;font-size:17px}
.st-txt small{font-family:var(--body);font-size:12.5px;color:var(--ink-2)}
.st-bar{display:block;height:4px;background:#E9EEF2}
.st-bar i{display:block;height:100%;width:0;background:var(--tc)}
.checks{list-style:none;margin:0;padding:2px 10px 9px 45px;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.checks li{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.checks li::before{content:attr(data-n);flex:none;display:grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink-3);background:#fff}
.checks li.now{color:var(--ink);font-weight:700}
.checks li.now::before{border-color:var(--ink);background:var(--tc);color:#fff}
.checks li.done{color:var(--ink)}
.checks li.done::before{content:'✓';border-color:var(--ink);background:var(--ink);color:#fff}
.ck-btn{font-family:var(--body);font-size:inherit;font-weight:inherit;color:inherit;background:none;padding:0;text-align:left;line-height:1.3}
.ck-btn:hover{text-decoration:underline}
/* ---------- 작은 화면 ---------- */
@media(max-width:600px){
  .btn{font-size:15px;padding:6px 11px}
  .controls .spacer{display:none}
  .controls .btn{flex:1 1 calc(50% - 8px);min-width:0}
  .ex-row{flex-wrap:wrap}
  .ex-main{flex-basis:100%;order:2}
  .ex-btn{margin-left:auto}
  .explain{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* ---------- 푸터 ---------- */
.site-foot{max-width:var(--maxw);margin:0 auto;padding:4px 16px 8px;text-align:center;font-size:13px;color:var(--ink-2);width:100%}
.panel{border-radius:14px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>해파 탐구실</h1><span class="sub">풍랑·너울·연안 쇄파</span></div>
</header>
<main class="wrap">

<section class="panel active" id="panel3">
  <div class="lab-grid">
    <div class="sim">
      <div class="stage-wrap" id="stage3">
        <svg id="svg3" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"></svg>
        <div class="badge" id="badge3">① 풍랑</div>
      </div>
      <div class="controls">
        <div class="spacer"></div>
        <button class="btn primary" id="t3-play">▶ 전체 재생</button>
        <button class="btn" id="t3-pause">⏸ 일시 정지</button>
      </div>
      <div id="ex3"></div>
    </div>
    <div class="lab-side">
      <div class="card">
        <h3>관찰 순서</h3>
        <ol class="stepper" id="st3"></ol>
      </div>
    </div>
  </div>
</section>

</main>
<footer class="site-foot">© 2026 제작: 김연경(earthssaem@gmail.com)</footer>
<script>
/* ===== 공통 (js/common.js 에서 이 탭이 쓰는 부분) ===== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
/* 해설 카드: '<b>제목</b> — 핵심 해설<small>추가 설명</small>' 형식의 글을 받아
   제목 · 핵심 해설(항상 보임) · 추가 설명('자세히 보기'로 펼치고 접음)으로 나눠 시뮬레이션 아래 카드에 표시.
   <small> 이 없으면 '자세히 보기' 버튼을 숨김. 반환값: set(html) 함수 */
function explainCard(el) {
  el.classList.add('explain');
  el.innerHTML = '<div class="ex-row"><span class="ex-title"></span><div class="ex-main" aria-live="polite"></div><button type="button" class="ex-btn" aria-expanded="false"></button></div><div class="ex-more"></div>';
  const title = el.querySelector('.ex-title'), main = el.querySelector('.ex-main'), btn = el.querySelector('.ex-btn'), more = el.querySelector('.ex-more');
  let open = false;
  const sync = () => { more.hidden = !open || btn.hidden; btn.setAttribute('aria-expanded', open); btn.textContent = open ? '접기 ▴' : '자세히 보기 ▾'; };
  btn.onclick = () => { open = !open; sync(); };
  return html => {
    const sm = html.match(/<small>([\s\S]*)<\/small>\s*$/);
    let body = sm ? html.slice(0, sm.index) : html;
    const m = body.match(/^<b>(.*?)<\/b>\s*—\s*/);
    if (m) body = body.slice(m[0].length);
    title.innerHTML = m ? m[1] : ''; title.hidden = !m;
    main.innerHTML = body.trim();
    more.innerHTML = sm ? sm[1] : ''; btn.hidden = !sm;
    el.hidden = !html; if (!html) open = false; // 카드를 숨기면 '자세히'도 접힌 상태로 되돌림
    sync();
  };
}
const SVGNS = 'http://www.w3.org/2000/svg';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
function E(tag, attrs = {}, children = []) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children) if (c) e.appendChild(c);
  return e;
}
function attr(e, o) { for (const k in o) e.setAttribute(k, o[k]); return e; }
/* ---- 일시 정지 (전역) ---- */
let _paused = false;
const _pauseBtns = [];
function syncPauseBtns() { _pauseBtns.forEach(b => { b.textContent = _paused ? '▶ 재생' : '⏸ 일시 정지'; }); }
function registerPauseBtn(btn) { _pauseBtns.push(btn); btn.addEventListener('click', () => { _paused = !_paused; syncPauseBtns(); }); }
function setPaused(v) { _paused = v; syncPauseBtns(); }
/* ---- 글자 폭 추정 + 알약 이름표 ---- */
function textW(t, fs) { let w = 0; for (const ch of t) { w += /[가-힣]/.test(ch) ? fs * .92 : /[①-⑳ⓐ-ⓩ⏱↔→←]/.test(ch) ? fs * .95 : /[A-Z]/.test(ch) ? fs * .64 : /[0-9a-z.]/.test(ch) ? fs * .52 : ch === ' ' ? fs * .3 : fs * .62; } return w; }
function pill(text, o = {}) {
  const fs = o.fs || 18, pad = o.pad ?? 10, h = fs + pad;
  const g = E('g', { class: 'pill' });
  const r = E('rect', { rx: h / 2, fill: o.bg || '#FFFDF8', stroke: '#24303A', 'stroke-width': o.sw ?? 3, y: -h / 2, height: h });
  const t = E('text', { 'text-anchor': 'middle', 'font-family': 'Jua', 'font-size': fs, fill: o.color || '#24303A', y: fs * .36, text });
  g.appendChild(r); g.appendChild(t);
  const set = s => { t.textContent = s; const w = textW(s, fs) + pad * 2; attr(r, { x: -w / 2, width: w }); };
  set(text);
  const move = (x, y) => g.setAttribute('transform', `translate(${x},${y})`);
  return { g, set, move };
}
/* 양방향 화살표 path */
function arrowD(x1, y1, x2, y2, h = 10) {
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const head = (x, y, dir) => `M${x + Math.cos(dir + Math.PI * .8) * h} ${y + Math.sin(dir + Math.PI * .8) * h} L${x} ${y} L${x + Math.cos(dir - Math.PI * .8) * h} ${y + Math.sin(dir - Math.PI * .8) * h}`;
  return `M${x1} ${y1} L${x2} ${y2} ${head(x2, y2, ang)} ${head(x1, y1, ang + Math.PI)}`;
}

/* ---- 애니메이션 루프: 이 파일에는 탭이 하나뿐이므로 frames['3']만 호출 ---- */
const frames = {};
let _last = performance.now();
(function loop(now) {
  let dt = (now - _last) / 1000; _last = now; if (dt > 0.1) dt = 0.1;
  if (!_paused && frames['3']) frames['3'](dt);
  requestAnimationFrame(loop);
})(performance.now());

/* ===== 문구 (js/text.js 의 tab3) ===== */
const TEXT = {
  tab3: {
    /* 단계: 그림 배지·관찰 순서 카드 */
    steps: [
      { badge: '① 풍랑', name: '풍랑', where: '바람이 부는 해역' },
      { badge: '② 너울', name: '너울', where: '발생 해역 밖' },
      { badge: '③ 연안 쇄파', name: '연안 쇄파', where: '수심이 얕아지는 해안' },
    ],
    /* ③ 단계에서 순서대로 관찰할 변화 */
    checks: ['속도 감소', '파장 감소', '파고 증가', '부서짐'],
    /* 그림 안 이름표 */
    wind: '바람', windZone: '바람이 부는 해역', calmZone: '발생 해역 밖',
    speed: '속도', length: '파장', height: '파고', depth: '수심', first: '처음', now: '현재',
    /* 재생 버튼 */
    play: '▶ 전체 재생', replay: '↺ 다시 재생',
    /* 단계별 해설 (①·②, 그리고 ③으로 카메라가 이동하는 동안) */
    cap: [
      '<b>풍랑</b> — 바람이 부는 해역에서 발생한 해파로, 파도의 모양과 크기가 비교적 불규칙해요.<small>바람이 셀수록, 오래 불수록, 바람이 부는 해역이 넓을수록 파고와 파장이 커져요. 바람의 영향을 직접 받아 마루가 뾰족한 파도가 많아요.</small>',
      '<b>너울</b> — 파도를 만든 바람의 발생 해역 밖으로 나오면, 마루가 둥글고 파장이 길고 고른 해파인 너울로 변해요.<small>바람이 멎어서가 아니라 파도가 발생 해역을 벗어난 거예요. 파장이 짧은 해파는 전파되는 동안 쉽게 약해지고, 파장이 긴 해파는 더 빠르게 멀리까지 전달돼요. 그래서 바람이 잔잔한 날에도 먼 바다에서 온 너울이 해안에 밀려올 수 있어요.</small>',
      '<b>연안 쇄파</b> — 너울이 해안에 접근하면서 수심이 얕아지면 속도가 느려지고 파장이 짧아지며 파고가 높아져요. 마루 하나를 골라 부서질 때까지 따라가며 차례로 살펴봐요.',
    ],
    /* ③ 추적 단계별 해설: 속도 감소 → 파장 감소 → 파고 증가 → 부서짐 → 부서진 뒤 */
    cap3: [

    }
  }
  /* 쇄파 순간 확대: 부서지는 마루와 그 앞 수면 중심(쇄파 지점 기준), 1.7배, 하늘·해저 비중을 줄임. 캔버스·뒤 SVG 에 같은 viewBox */
  function zoomView() {
    let z = 1;
    if (stage === 2 && track) z = 1 + .7 * sm(track.ts0 - .6, track.ts0 + .6, t) * (1 - sm(track.ts1 - .4, track.ts1 + 1.4, t));
    const w = 960 / z, h = 540 / z, cx = XB - camX + 40, cy = Y0 + 6;
    view = z === 1 ? [0, 0, 960, 540] : [clamp(cx - w / 2, 0, 960 - w), clamp(cy - h / 2, 0, 540 - h), w, h];
    const vb = view.map(v => +v.toFixed(1)).join(' ');
    if (vb !== zoom) { zoom = vb; svg.setAttribute('viewBox', vb); }
  }
  let camStr = '';
  function render(dt) {
    if (state === 'play' && stage === 2 && track && t >= track.ts0 && t < track.ts1) dt *= SLOW; // 넘어가는 순간은 느리게 (수면·거품·표시·설명·막대 모두 같은 시간 기준)
    t += dt;
    if (state === 'play') { tau += dt; if (tau >= TOTAL) { tau = TOTAL; state = 'end'; syncButtons(); } }
    const st = stageAt(tau); if (st !== stage) enterStage(st);
    camX = camNow();
    const cs = camX.toFixed(1);
    if (cs !== camStr) { // 카메라가 움직일 때만 SVG 그룹 이동
      camStr = cs;
      back.setAttribute('transform', `translate(${-cs},0)`);
      mid.setAttribute('transform', `translate(${(-camX * PAR_MID).toFixed(1)},0)`); clouds.setAttribute('transform', `translate(${(-camX * PAR_MID).toFixed(1)},0)`);
    }
    if (dt > 0 && dt < .1) watchFps(dt);
    surface(); whitecaps(dt); zoomView(); drawCanvas(); annotate(); syncProgress();
  }

  /* ---- 관찰 순서 카드·버튼·해설 ---- */
  const setExplain = explainCard($('#ex3'));
  const stepEls = TX.steps.map((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button type="button" class="st-btn"><span class="st-num">${i + 1}</span><span class="st-txt"><b>${s.name}</b><small>${s.where}</small></span></button><span class="st-bar"><i></i></span>`;
    li.querySelector('button').onclick = () => playFrom(START[i]);
    $('#st3').appendChild(li); return li;
  });
  const checks = document.createElement('ul'); checks.className = 'checks';
  checks.innerHTML = TX.checks.map((c, i) => `<li data-n="${i + 1}"><button type="button" class="ck-btn">${c}</button></li>`).join('');
  stepEls[2].appendChild(checks);
  const checkEls = Array.from(checks.children), bars = stepEls.map(li => li.querySelector('.st-bar i')), barW = [];
  checkEls.forEach((li, i) => { li.querySelector('.ck-btn').onclick = () => jumpTo(i); });
  function syncProgress() {
    stepEls.forEach((li, i) => {
      const f = state === 'idle' ? 0 : clamp((tau - START[i]) / DUR[i], 0, 1);
      const w = Math.round(f * 200) / 2 + '%'; // 0.5 % 단위로만 바꿔 매 프레임 페이지 레이아웃을 피함
      if (barW[i] !== w) { barW[i] = w; bars[i].style.width = w; }
      li.classList.toggle('on', i === stage); li.classList.toggle('done', state !== 'idle' && f >= 1 && i !== stage);
    });
  }
  function enterStage(st) {
    stage = st; $('#badge3').textContent = TX.steps[st].badge; setExplain(TX.cap[st]);
    track = null; phase = -1; checkEls.forEach(li => li.classList.remove('now', 'done'));
    if (st === 2) pickTrack(); else { TOTAL = START[2] + DUR[2]; }
  }
  /* 관찰 순서 카드의 항목을 누르면 그 단계의 처음부터 (③ 밖이면 ③ 처음부터) */
  function jumpTo(i) {
    if (!(stage === 2 && track) || state === 'idle') { playFrom(START[2]); return; }
    const ts = [track.tin, track.t1, track.t2, track.ts0][i];
    t = ts; tau = Math.max(ts + OFF, START[2] + P3); OFF = tau - t; TOTAL = track.tEnd + OFF; DUR[2] = TOTAL - START[2];
    state = 'play'; phase = -1; setPaused(false); syncButtons();
  }
  const playBtn = $('#t3-play');
  function syncButtons() { playBtn.textContent = state === 'idle' ? TX.play : TX.replay; playBtn.classList.toggle('primary', state !== 'play'); }
  function playFrom(s) { tau = s; state = 'play'; stage = -1; setPaused(false); syncButtons(); }
  playBtn.onclick = () => playFrom(0);
  registerPauseBtn($('#t3-pause'));
  syncButtons(); render(0);
  frames['3'] = render;
})();
</script>
</body>
</html>
